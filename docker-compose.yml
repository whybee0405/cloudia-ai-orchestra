services:

  # ── Database ──────────────────────────────────────────────────────────────────
  # Single Postgres instance; all four databases live here.
  # cloudia_brand_dna is created by POSTGRES_DB; the init script creates the rest.

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cloudia_brand_dna
      POSTGRES_USER: cloudia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    networks: [cloudia-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudia -d cloudia_brand_dna"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────────────────────────

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks: [cloudia-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── MinIO ─────────────────────────────────────────────────────────────────────

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    networks: [cloudia-net]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Brand DNA Service ─────────────────────────────────────────────────────────
  # Entrypoint runs `alembic upgrade head` before starting the server.

  brand-dna:
    build:
      context: ./cloudia-ai-brand-dna-service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://cloudia:${POSTGRES_PASSWORD}@postgres:5432/cloudia_brand_dna
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      CAMPAIGNS_SERVICE_URL: http://campaigns-api:8000
      ADS_SERVICE_URL: http://ads:8000
      WEBDEV_SERVICE_URL: http://webdev-api:8000
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: cloudia-brand-assets
      MINIO_SECURE: "false"
      ENVIRONMENT: ${ENVIRONMENT:-production}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost}
    networks: [cloudia-net]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/internal/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Campaign Director ─────────────────────────────────────────────────────────

  campaigns-api:
    build:
      context: ./cloudia-ai-campaign-director-agent
      dockerfile: docker/Dockerfile.api
    command: ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://cloudia:${POSTGRES_PASSWORD}@postgres:5432/cloudia_campaigns
      REDIS_URL: redis://redis:6379/0
      BRAND_DNA_SERVICE_URL: http://brand-dna:8000
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      SECRET_KEY: ${CAMPAIGNS_SECRET_KEY}
      ENCRYPTION_KEY: ${CAMPAIGNS_ENCRYPTION_KEY}
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: cloudia-media
      MINIO_SECURE: "false"
      ENVIRONMENT: ${ENVIRONMENT:-production}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost}
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID:-}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET:-}
      TIKTOK_CLIENT_KEY: ${TIKTOK_CLIENT_KEY:-}
      TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:-}
      TWITTER_CLIENT_ID: ${TWITTER_CLIENT_ID:-}
      TWITTER_CLIENT_SECRET: ${TWITTER_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      OAUTH_CALLBACK_BASE_URL: ${OAUTH_CALLBACK_BASE_URL:-https://your-domain.com/api/campaigns}
    networks: [cloudia-net]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      brand-dna:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  campaigns-worker:
    build:
      context: ./cloudia-ai-campaign-director-agent
      dockerfile: docker/Dockerfile.api
    command: ["celery", "-A", "backend.worker.celery_app", "worker", "-l", "info", "-Q", "default", "-c", "4"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://cloudia:${POSTGRES_PASSWORD}@postgres:5432/cloudia_campaigns
      REDIS_URL: redis://redis:6379/0
      BRAND_DNA_SERVICE_URL: http://brand-dna:8000
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      ENCRYPTION_KEY: ${CAMPAIGNS_ENCRYPTION_KEY}
      MINIO_ENDPOINT: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: cloudia-media
      MINIO_SECURE: "false"
    networks: [cloudia-net]
    depends_on:
      redis:
        condition: service_healthy
      campaigns-api:
        condition: service_healthy

  # ── Google Ads Agent ──────────────────────────────────────────────────────────

  ads:
    build:
      context: ./cloudia-ai-googleads-agent/google_ads_agents
    command: ["python", "main.py"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://cloudia:${POSTGRES_PASSWORD}@postgres:5432/cloudia_ads
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      API_HOST: "0.0.0.0"
      API_PORT: "8000"
      API_SECRET_KEY: ${ADS_SECRET_KEY}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      GOOGLE_ADS_DEVELOPER_TOKEN: ${GOOGLE_ADS_DEVELOPER_TOKEN:-}
      GOOGLE_ADS_CLIENT_ID: ${GOOGLE_ADS_CLIENT_ID:-}
      GOOGLE_ADS_CLIENT_SECRET: ${GOOGLE_ADS_CLIENT_SECRET:-}
      GOOGLE_ADS_REFRESH_TOKEN: ${GOOGLE_ADS_REFRESH_TOKEN:-}
      GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${GOOGLE_ADS_LOGIN_CUSTOMER_ID:-}
    networks: [cloudia-net]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/internal/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── WebDev Agent ──────────────────────────────────────────────────────────────

  webdev-api:
    build:
      context: ./cloudia-ai-webdev-agent
      dockerfile: docker/Dockerfile.api
    command: ["uvicorn", "backend.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://cloudia:${POSTGRES_PASSWORD}@postgres:5432/cloudia_webdev
      REDIS_URL: redis://redis:6379/1
      BRAND_DNA_SERVICE_URL: http://brand-dna:8000
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      SECRET_KEY: ${WEBDEV_SECRET_KEY}
      ENCRYPTION_KEY: ${WEBDEV_ENCRYPTION_KEY}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost}
    networks: [cloudia-net]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      brand-dna:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  webdev-worker:
    build:
      context: ./cloudia-ai-webdev-agent
      dockerfile: docker/Dockerfile.api
    command: ["celery", "-A", "backend.worker.celery_app", "worker", "-l", "info", "-Q", "default", "-c", "2"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://cloudia:${POSTGRES_PASSWORD}@postgres:5432/cloudia_webdev
      REDIS_URL: redis://redis:6379/1
      BRAND_DNA_SERVICE_URL: http://brand-dna:8000
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      SECRET_KEY: ${WEBDEV_SECRET_KEY}
      ENCRYPTION_KEY: ${WEBDEV_ENCRYPTION_KEY}
    networks: [cloudia-net]
    depends_on:
      redis:
        condition: service_healthy
      webdev-api:
        condition: service_healthy

  # ── Nginx Gateway + Frontend ──────────────────────────────────────────────────
  # Single container: builds the React SPA and serves it alongside the API proxy.

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      WEBDEV_SECRET_KEY: ${WEBDEV_SECRET_KEY}
      NGINX_ENVSUBST_TEMPLATE_VARS: WEBDEV_SECRET_KEY
    networks: [cloudia-net]
    depends_on:
      - brand-dna
      - campaigns-api
      - ads
      - webdev-api

# ── Volumes ───────────────────────────────────────────────────────────────────

volumes:
  pgdata:
  redis-data:
  minio-data:

# ── Network ───────────────────────────────────────────────────────────────────

networks:
  cloudia-net:
    driver: bridge
