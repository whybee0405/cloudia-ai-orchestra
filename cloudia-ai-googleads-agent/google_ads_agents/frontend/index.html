<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CloudIA — Agent Control</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar"></aside>
    <div id="main">
      <header id="topbar">
        <div id="topbar-left">
          <h1 id="page-title">Dashboard</h1>
          <p id="page-subtitle" class="text-muted"></p>
        </div>
        <nav id="breadcrumb" aria-label="Breadcrumb"></nav>
      </header>
      <main id="content"></main>
    </div>
  </div>

  <!-- Toast container -->
  <div id="toast-container" role="region" aria-live="polite" aria-label="Notifications"></div>

  <!-- Modal overlay -->
  <div id="modal-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div id="modal-box">
      <div id="modal-header">
        <h2 id="modal-title"></h2>
        <button id="modal-close" class="btn btn-ghost btn-sm modal-close-btn" aria-label="Close modal">&times;</button>
      </div>
      <div id="modal-body"></div>
      <div id="modal-footer"></div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
