version: '3.9'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: cloudia_content
      POSTGRES_USER: cloudia
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudia -d cloudia_content"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ../backend:/app/backend
    ports:
      - "8001:8000"
    env_file: ../.env
    environment:
      - DATABASE_URL=postgresql://cloudia:${DB_PASSWORD}@db:5432/cloudia_content
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    command: celery -A backend.tasks.celery_app worker --loglevel=info -Q content,publishing,analytics
    volumes:
      - ../backend:/app/backend
    env_file: ../.env
    environment:
      - DATABASE_URL=postgresql://cloudia:${DB_PASSWORD}@db:5432/cloudia_content
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  beat:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    command: celery -A backend.tasks.celery_app beat --loglevel=info
    volumes:
      - ../backend:/app/backend
    env_file: ../.env
    environment:
      - DATABASE_URL=postgresql://cloudia:${DB_PASSWORD}@db:5432/cloudia_content
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
    command: npm run dev -- --host
    volumes:
      - ../frontend/src:/app/src
    ports:
      - "5174:5173"
    environment:
      - VITE_API_URL=http://localhost:8001

volumes:
  postgres_data:
  minio_data:
