name: cloudia-prod

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cloudia
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: cloudia_websites
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No exposed ports in production — only internal network access
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudia -d cloudia_websites"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    # No exposed ports in production — only internal network access
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --workers 4
    restart: unless-stopped
    env_file:
      - ../.env.prod
    environment:
      DATABASE_URL: postgresql://cloudia:${DB_PASSWORD}@db:5432/cloudia_websites
      REDIS_URL: redis://redis:6379/0
    # No exposed ports — nginx proxies to this service internally
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    command: celery -A backend.worker.celery_app worker --loglevel=warning --concurrency=4
    restart: unless-stopped
    env_file:
      - ../.env.prod
    environment:
      DATABASE_URL: postgresql://cloudia:${DB_PASSWORD}@db:5432/cloudia_websites
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
      target: production
    restart: unless-stopped
    # No exposed ports — nginx proxies to this service internally

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    depends_on:
      - api
      - frontend

  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    # Run manually to issue/renew certificates:
    #   docker compose -f docker/docker-compose.prod.yml run --rm certbot renew
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  postgres_data:
  redis_data:
  certbot_www:
  certbot_conf:
