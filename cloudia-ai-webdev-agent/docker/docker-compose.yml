name: cloudia-dev

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cloudia
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme_in_production}
      POSTGRES_DB: cloudia_websites
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudia -d cloudia_websites"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://cloudia:${DB_PASSWORD:-changeme_in_production}@db:5432/cloudia_websites
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ../backend:/app/backend
      - ../alembic.ini:/app/alembic.ini
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    command: celery -A backend.worker.celery_app worker --loglevel=info --concurrency=4
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://cloudia:${DB_PASSWORD:-changeme_in_production}@db:5432/cloudia_websites
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ../backend:/app/backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
      target: development
    command: npm run dev -- --host
    volumes:
      - ../frontend/src:/app/src
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000

volumes:
  postgres_data:
  redis_data:
