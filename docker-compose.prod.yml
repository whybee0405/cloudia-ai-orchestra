# Production overrides — use with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Adds SSL via Certbot, resource limits, and production-hardened settings.

services:

  # SSL termination is handled by the ERP nginx (cloudia-erp) which is the
  # single VPS gateway on ports 80/443. This nginx handles only internal
  # service routing within the cloudia-net Docker network, accessible at
  # 127.0.0.1:8082 on the host for ERP nginx to proxy to.
  nginx:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/cloudia.conf.template:/etc/nginx/templates/cloudia.conf.template:ro
    environment:
      WEBDEV_SECRET_KEY: ${WEBDEV_SECRET_KEY}
      NGINX_ENVSUBST_TEMPLATE_VARS: WEBDEV_SECRET_KEY

  brand-dna:
    environment:
      ENVIRONMENT: production
    deploy:
      resources:
        limits:
          memory: 512m

  campaigns-api:
    deploy:
      resources:
        limits:
          memory: 1g

  campaigns-worker:
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 2g

  ads:
    deploy:
      resources:
        limits:
          memory: 512m

  webdev-api:
    deploy:
      resources:
        limits:
          memory: 512m

  webdev-worker:
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 2g

volumes: {}
